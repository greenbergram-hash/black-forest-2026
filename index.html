<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>היער השחור 2026</title>

<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1210" media="(prefers-color-scheme: dark)">
<meta name="description" content="תוכנית הטיול המשפחתי ביער השחור, 17–24 באוגוסט 2026">

<!-- iOS "Add to Home Screen" -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="היער השחור">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" id="topbar">
  <span class="topbar-icon" id="topbarIcon"></span>
  <div class="topbar-text">
    <strong>היער השחור</strong>
    <span id="topbarSub">17–24 באוגוסט 2026</span>
  </div>
</header>

<main id="app">
  <section id="view-now" class="view"></section>
  <section id="view-itinerary" class="view"></section>
  <section id="view-weather" class="view"></section>
  <section id="view-redcard" class="view"></section>
  <section id="view-info" class="view"></section>
</main>

<nav class="tabbar">
  <button class="tab" data-view="now">
    <span class="tab-icon" data-icon="clock"></span><span>עכשיו</span>
  </button>
  <button class="tab" data-view="itinerary">
    <span class="tab-icon" data-icon="calendar"></span><span>מסלול</span>
  </button>
  <button class="tab" data-view="weather">
    <span class="tab-icon" data-icon="cloud"></span><span>מזג אוויר</span>
  </button>
  <button class="tab" data-view="redcard">
    <span class="tab-icon" data-icon="ticket"></span><span>כרטיס אדום</span>
  </button>
  <button class="tab" data-view="info">
    <span class="tab-icon" data-icon="info"></span><span>מידע</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
